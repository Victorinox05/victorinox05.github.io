<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 750">
  <!-- Ilustración de ZeroSpoil (Invent For The Planet 2026): no hay fotos del prototipo -->
  <defs>
    <linearGradient id="fondo" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#081326"/><stop offset="1" stop-color="#10264a"/>
    </linearGradient>
    <linearGradient id="luz" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#cfe4ff" stop-opacity=".16"/><stop offset="1" stop-color="#cfe4ff" stop-opacity="0"/>
    </linearGradient>
    <pattern id="puntos" width="24" height="24" patternUnits="userSpaceOnUse">
      <circle cx="12" cy="12" r="1.2" fill="#5aa8ff" opacity=".18"/>
    </pattern>
  </defs>
  <rect width="1200" height="750" fill="url(#fondo)"/>
  <rect width="1200" height="750" fill="url(#puntos)"/>

  <!-- Nevera abierta -->
  <rect x="300" y="60" width="600" height="640" rx="28" fill="#0f2142" stroke="#5aa8ff" stroke-width="4"/>
  <rect x="330" y="90" width="540" height="580" rx="16" fill="#132a52"/>
  <path d="M330 90h540l-60 220H390z" fill="url(#luz)"/>
  <g stroke="#9ccbff" stroke-width="5" stroke-linecap="round" opacity=".7">
    <path d="M345 300h510M345 470h510M345 625h510"/>
  </g>

  <!-- Cámara (Smart-Shelf Box) arriba, con su campo de visión -->
  <path d="M600 128L380 640M600 128L820 640" stroke="#5aa8ff" stroke-width="2" stroke-dasharray="6 8" opacity=".45"/>
  <rect x="555" y="98" width="90" height="46" rx="10" fill="#1b3766" stroke="#cfe4ff" stroke-width="3"/>
  <circle cx="600" cy="121" r="14" fill="#081326" stroke="#5aa8ff" stroke-width="4"/>
  <circle cx="605" cy="116" r="4" fill="#cfe4ff"/>
  <circle cx="634" cy="108" r="4" fill="#34d399"/>

  <!-- Estante 1: brick de leche y tomates -->
  <rect x="400" y="190" width="70" height="110" rx="6" fill="#e9f1fb"/><path d="M400 190l35-30 35 30z" fill="#cfe0f5"/>
  <rect x="412" y="225" width="46" height="28" rx="4" fill="#5aa8ff"/>
  <circle cx="560" cy="275" r="25" fill="#ef4444"/><circle cx="607" cy="279" r="21" fill="#dc2626"/>
  <path d="M553 252l7 6 8-6M601 259l6 5 7-5" stroke="#22c55e" stroke-width="4" fill="none" stroke-linecap="round"/>
  <!-- Estante 2: manzanas verdes y queso -->
  <circle cx="440" cy="442" r="27" fill="#4ade80"/><circle cx="492" cy="446" r="23" fill="#22c55e"/>
  <path d="M440 415v-9M492 423v-8" stroke="#7c4a1e" stroke-width="4" stroke-linecap="round"/>
  <path d="M640 470l60-58 70 58z" fill="#facc15"/><circle cx="690" cy="452" r="6" fill="#ca8a04"/><circle cx="716" cy="460" r="4" fill="#ca8a04"/>
  <!-- Estante 3: tarro y botella -->
  <rect x="560" y="555" width="62" height="70" rx="10" fill="#a3e635" opacity=".85"/><rect x="556" y="545" width="70" height="16" rx="4" fill="#cfe4ff"/>
  <rect x="740" y="520" width="34" height="105" rx="10" fill="#60a5fa" opacity=".8"/><rect x="749" y="502" width="16" height="22" rx="3" fill="#cfe4ff"/>

  <!-- Recuadros de detección por color (OpenCV) -->
  <g fill="none" stroke-width="4" stroke-linecap="round">
    <path d="M525 236v-12h12M628 224h12v12M640 296v12h-12M537 308h-12v-12" stroke="#ef4444"/>
    <path d="M400 403v-12h12M507 391h12v12M519 469v12h-12M412 481h-12v-12" stroke="#4ade80"/>
    <path d="M628 395v-12h12M760 383h12v12M772 470v12h-12M640 482h-12v-12" stroke="#facc15"/>
  </g>
  <g font-family="ui-monospace, 'JetBrains Mono', Menlo, Consolas, monospace" font-size="17" font-weight="700">
    <rect x="533" y="190" width="100" height="28" rx="7" fill="#ef4444"/><text x="583" y="210" text-anchor="middle" fill="#fff">H 0–10</text>
    <rect x="410" y="355" width="100" height="28" rx="7" fill="#4ade80"/><text x="460" y="375" text-anchor="middle" fill="#052e16">H 40–80</text>
    <rect x="652" y="347" width="100" height="28" rx="7" fill="#facc15"/><text x="702" y="367" text-anchor="middle" fill="#422006">H 20–35</text>
  </g>

  <!-- Aviso en el móvil -->
  <g transform="translate(940 250)">
    <rect width="190" height="330" rx="26" fill="#0d1a30" stroke="#5aa8ff" stroke-width="4"/>
    <rect x="70" y="14" width="50" height="6" rx="3" fill="#1b3766"/>
    <rect x="18" y="44" width="154" height="60" rx="12" fill="#13233d"/>
    <circle cx="42" cy="74" r="12" fill="#ef4444"/><rect x="62" y="62" width="92" height="9" rx="4" fill="#cfe4ff"/><rect x="62" y="78" width="66" height="8" rx="4" fill="#5aa8ff"/>
    <rect x="18" y="116" width="154" height="60" rx="12" fill="#13233d"/>
    <circle cx="42" cy="146" r="12" fill="#facc15"/><rect x="62" y="134" width="80" height="9" rx="4" fill="#cfe4ff"/><rect x="62" y="150" width="96" height="8" rx="4" fill="#5aa8ff" opacity=".7"/>
    <rect x="18" y="188" width="154" height="60" rx="12" fill="#13233d"/>
    <circle cx="42" cy="218" r="12" fill="#4ade80"/><rect x="62" y="206" width="70" height="9" rx="4" fill="#cfe4ff"/><rect x="62" y="222" width="54" height="8" rx="4" fill="#5aa8ff" opacity=".5"/>
    <rect x="40" y="272" width="110" height="34" rx="17" fill="#5aa8ff"/>
  </g>
  <path d="M900 330c20 0 24-30 40-30" stroke="#5aa8ff" stroke-width="3" fill="none" stroke-dasharray="5 7"/>

  <!-- Nombre -->
  <text x="60" y="690" font-family="'Space Grotesk', 'Segoe UI', system-ui, sans-serif" font-size="44" font-weight="700" fill="#e8f1ff">ZeroSpoil</text>
  <text x="62" y="718" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="17" fill="#9ccbff">Invent For The Planet 2026</text>
</svg>
